name: Windows installer upgrade
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      baselineTag:
        required: true
        description: Release tag for the previous full installer
      candidateTag:
        required: true
        description: Draft release tag for the new full installer
      baselineSha256:
        required: true
        description: SHA256 of the previously verified installer
      candidateSha256:
        required: true
        description: SHA256 of the exact candidate
permissions:
  contents: read
jobs:
  public-downloads:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: windows-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify both permanent QR downloads without credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($pair in @(
            @{ repo='thali-pos-downloads'; asset='Thali-POS-Setup.exe' },
            @{ repo='thali-captain-downloads'; asset='Thali-Captain.apk' }
          )) {
            $repo = 'sankaleshPal/'+$pair.repo
            $release = Invoke-RestMethod "https://api.github.com/repos/$repo/releases/latest"
            $asset = $release.assets | Where-Object name -ceq $pair.asset | Select-Object -First 1
            if (!$asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Missing released asset or digest' }
            $url = "https://github.com/$repo/releases/latest/download/"+$pair.asset
            curl.exe -fsSL --retry 2 --max-time 180 $url -o $pair.asset
            if ($LASTEXITCODE -ne 0 -or $asset.digest -ne ('sha256:'+(Get-FileHash $pair.asset).Hash)) { throw 'Public download verification failed' }
            Write-Host "$($release.tag_name) $($asset.name) $($asset.size) bytes $($asset.digest)"
          }
  upgrade:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 18
    # Draft links grant temporary read access to one file. No repo token or source is needed.
    permissions:
      contents: none
    steps:
      - name: Download both release assets and verify their hashes
        shell: pwsh
        env:
          OLD_LINK: ${{ secrets.QA_BASELINE_DOWNLOAD }}
          NEW_LINK: ${{ secrets.QA_CANDIDATE_DOWNLOAD }}
          REPO: ${{ github.repository }}
          OLD_TAG: ${{ inputs.baselineTag }}
          NEW_TAG: ${{ inputs.candidateTag }}
          OLD_HASH: ${{ inputs.baselineSha256 }}
          NEW_HASH: ${{ inputs.candidateSha256 }}
        run: |
          foreach ($v in 'OLD','NEW') {
            $tag = [Environment]::GetEnvironmentVariable($v + '_TAG')
            $hash = [Environment]::GetEnvironmentVariable($v + '_HASH')
            if ($tag -notmatch '^[a-zA-Z0-9][a-zA-Z0-9.-]*$' -or $hash -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid release input' }
            $link = [Environment]::GetEnvironmentVariable($v + '_LINK')
            if ($link) {
              $uri = [uri]$link
              if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'release-assets.githubusercontent.com') { throw 'Expected a GitHub release asset' }
            } else { $link = "https://github.com/$env:REPO/releases/download/$tag/Thali-POS-Setup.exe" }
            try { Invoke-WebRequest -Uri $link -OutFile "$v.exe" } catch { throw "Could not download $tag. Refresh its draft link." }
            if ((Get-FileHash "$v.exe").Hash -ne $hash) { throw 'Installer digest check failed' }
          }
      - name: Install, seed a scratch restaurant, upgrade and verify persisted data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = 'C:\ThaliUpgradeTest'
          $exe = Join-Path $install 'Thali POS.exe'
          function Install-Thali($file) {
            $run = Start-Process (Resolve-Path $file) -ArgumentList '/S',"/D=$install" -Wait -PassThru
            if ($run.ExitCode -ne 0 -or !(Test-Path $exe)) { throw "Install failed: $file ($($run.ExitCode))" }
            $version = (Get-Item $exe).VersionInfo.ProductVersion
            Write-Host "Installed $file, product version $version"
            $version
          }
          function Start-Thali {
            $stderr = Join-Path $env:RUNNER_TEMP "thali-$([guid]::NewGuid()).log"
            $process = Start-Process $exe -PassThru -RedirectStandardError $stderr
            foreach ($attempt in 1..30) {
              try { if ((Invoke-RestMethod 'http://127.0.0.1:3333/ping' -NoProxy -TimeoutSec 2).message -eq 'pong') { return } } catch {}
              Start-Sleep 2
            }
            Write-Host "Process exited: $($process.HasExited)"
            foreach ($root in @($env:LOCALAPPDATA,$env:APPDATA)) {
              foreach ($dir in (Get-ChildItem $root -Directory -Filter '*thali*')) {
                Write-Host "Found app directory $($dir.Name)"
                foreach ($file in (Get-ChildItem "$($dir.FullName)/logs" -File -ErrorAction SilentlyContinue)) {
                  Get-Content $file.FullName -Tail 60 | Select-String 'error|exception|failed|cannot|MODULE_NOT_FOUND|NODE_MODULE_VERSION' | Select-Object -Last 12 | ForEach-Object { Write-Host $_.Line }
                }
              }
            }
            Get-Content $stderr -Tail 16
            throw 'Installed application did not start the local server'
          }
          function Stop-Thali {
            Get-Process -Name 'Thali POS' -ErrorAction SilentlyContinue | Where-Object Path -eq $exe | Stop-Process -Force
            Start-Sleep 3
          }
          $old = Install-Thali OLD.exe
          Start-Thali
          Stop-Thali
          $db = @('Thali POS','thali-pos','Thali') | ForEach-Object { Join-Path $env:LOCALAPPDATA "$_\data\thali.sqlite" } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$db) { throw 'Baseline database not found' }
          $licenseDir = Join-Path $env:APPDATA 'Thali\license'
          New-Item -ItemType Directory -Force $licenseDir | Out-Null
          $license = Join-Path $licenseDir 'thali.license'
          Set-Content $license '{"testFixture":"upgrade-preservation"}' -NoNewline
          $hash = (Get-FileHash $license).Hash
          $backup = Join-Path (Split-Path (Split-Path $db)) 'backups\upgrade-test.thalibak'
          New-Item -Type Directory -Force (Split-Path $backup) | Out-Null
          Set-Content $backup 'synthetic backup marker' -NoNewline
          $backupHash = (Get-FileHash $backup).Hash
          @'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              db.execute("PRAGMA foreign_keys=ON")
              db.execute("INSERT INTO outlet_admins(id,email) VALUES (?,?)", ("a"*24,"qa@example.invalid"))
              db.execute("INSERT INTO outlets(id,name,outletAdminId) VALUES (?,?,?)", ("b"*24,"Upgrade QA","a"*24))
              db.execute("INSERT INTO app_settings(key,value,updatedAt) VALUES (?,?,?)", ("qa.marker","42",1))
          '@ | python - $db
          if ($LASTEXITCODE -ne 0) { throw 'Could not seed scratch data' }
          $new = Install-Thali NEW.exe
          if ([version]$new -le [version]$old) { throw "Expected a newer installer, got $old -> $new" }
          Start-Thali
          if ((Get-FileHash $license).Hash -ne $hash -or (Get-FileHash $backup).Hash -ne $backupHash) { throw 'Licence or backup changed' }
          @'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              assert db.execute("PRAGMA integrity_check").fetchone() == ("ok",)
              assert db.execute("SELECT name FROM outlets WHERE id=?", ("b"*24,)).fetchone() == ("Upgrade QA",)
              assert db.execute("SELECT value FROM app_settings WHERE key='qa.marker'").fetchone() == ("42",)
          '@ | python - $db
          if ($LASTEXITCODE -ne 0) { throw 'Scratch data did not survive upgrade' }
          Stop-Thali
          Write-Host "Verified Windows upgrade $old -> $new"
